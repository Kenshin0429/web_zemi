<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自己紹介ページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, like a business card that grew into a page */
:root {
  --bg: #fbfbfa;
  --fg: #1c1f24;
  --muted: #6b7079;
  --line: #e2e3e0;
  --accent: #2f5bd3;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --fg: #e9eaec; --muted: #9aa0a9; --line: #2b2f36; --accent: #8aa8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --fg: #e9eaec; --muted: #9aa0a9; --line: #2b2f36; --accent: #8aa8ff;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.85;
}
.wrap {
  max-width: 600px;
  margin: 0 auto;
  padding-block: 72px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 56px;
}
header {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 28px;
}
.avatar {
  position: relative;
  width: 132px; height: 132px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--line);
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px var(--line);
  display: grid; place-items: center;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar .initial { font-size: 44px; font-weight: 900; color: var(--muted); }
.avatar img + .initial { display: none; }
.name { display: grid; gap: 6px; min-width: 0; }
@media (max-width: 480px) {
  header { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 20px; }
}
.label {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  margin: 0;
  font-size: clamp(36px, 9vw, 52px);
  font-weight: 900;
  line-height: 1.2;
  text-wrap: balance;
}
.reading { font-family: var(--font-mono); font-size: 14px; color: var(--accent); }
.lead { margin: 4px 0 0; font-size: 18px; color: var(--fg); }

section { display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 20px; }
h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }
p { margin: 0; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.tags li { border: 1px solid var(--line); border-radius: 999px; padding: 2px 14px; font-size: 14px; }

dl.history { margin: 0; display: grid; grid-template-columns: 5.5em 1fr; row-gap: 10px; column-gap: 16px; }
dl.history dt { font-family: var(--font-mono); font-size: 14px; color: var(--accent); font-variant-numeric: tabular-nums; padding-top: 2px; }
dl.history dd { margin: 0; min-width: 0; }

.icons { list-style: none; margin: 0; padding: 0; display: flex; gap: 12px; }
.icons a {
  width: 48px; height: 48px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--fg);
  transition: color .2s, border-color .2s, transform .2s, background .2s;
}
.icons a:hover, .icons a:focus-visible {
  color: var(--accent);
  border-color: var(--accent);
  transform: translateY(-2px);
}
.icons svg { width: 22px; height: 22px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 480px) { .icons { justify-content: center; } }

footer { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <!-- 写真: このフォルダに photo.jpg を置くと表示されます（無い場合はイニシャル表示） -->
    <div class="avatar">
      <img src="photo.jpg" alt="小酒井健真の写真" onerror="this.remove()">
      <span class="initial" aria-hidden="true">K</span>
    </div>
    <div class="name">
      <h1>小酒井健真</h1>
      <div class="reading">Kenshin Kozakai</div>
      <ul class="icons">
        <li>
          <a href="mailto:x24036xx@aitech.ac.jp" title="x24036xx@aitech.ac.jp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <span class="sr-only">メールを送る</span>
          </a>
        </li>
        <li>
          <!-- GitHub: YOUR_GITHUB_ID を自分のユーザー名に置き換えてください -->
          <a href="https://github.com/YOUR_GITHUB_ID" target="_blank" rel="noopener" title="GitHub">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
            <span class="sr-only">GitHub</span>
          </a>

      </ul>
    </div>
  </header>

  <section>
    <h2>わたしについて</h2>
    <p>2005年生まれ、岐阜県在住。</p>
    <p>愛知工業大学 情報科学部 情報科学科 メディア情報専攻 自然言語処理研究室所属の小酒井健真です。画像処理やLLMについて勉強しています。</p>
  </section>

  <section>
    <h2>取得資格</h2>
    <dl class="history">
      <dt>2025</dt>
      <dd>基本情報技術者試験</dd>
      <dt>2023</dt>
      <dd>情報処理検定1級</dd>
      <dt>2023</dt>
      <dd>ITパスポート</dd>
    </dl>
  </section>

  <section>
    <h2>経験した言語</h2>
    <ul class="tags">
      <li>C</li>
      <li>Python</li>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>C++</li>
    </ul>
  </section>

</main>
</body>
</html>
